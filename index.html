<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>25:00 — Pomodoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cube-bevel">
  <div class="cube-face">
    <div class="screen-bezel">
    <div class="screen">
      <svg class="tick-ring" viewBox="0 0 280 280">
        <!-- 60 tick marks generated by JS -->
      </svg>
      <div class="digits">
        <div class="digit" id="d0">
          <span class="seg seg-a"></span>
          <span class="seg seg-b"></span>
          <span class="seg seg-c"></span>
          <span class="seg seg-d"></span>
          <span class="seg seg-e"></span>
          <span class="seg seg-f"></span>
          <span class="seg seg-g"></span>
        </div>
        <div class="digit" id="d1">
          <span class="seg seg-a"></span>
          <span class="seg seg-b"></span>
          <span class="seg seg-c"></span>
          <span class="seg seg-d"></span>
          <span class="seg seg-e"></span>
          <span class="seg seg-f"></span>
          <span class="seg seg-g"></span>
        </div>
        <div class="colon" id="colon">
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div class="digit" id="d2">
          <span class="seg seg-a"></span>
          <span class="seg seg-b"></span>
          <span class="seg seg-c"></span>
          <span class="seg seg-d"></span>
          <span class="seg seg-e"></span>
          <span class="seg seg-f"></span>
          <span class="seg seg-g"></span>
        </div>
        <div class="digit" id="d3">
          <span class="seg seg-a"></span>
          <span class="seg seg-b"></span>
          <span class="seg seg-c"></span>
          <span class="seg seg-d"></span>
          <span class="seg seg-e"></span>
          <span class="seg seg-f"></span>
          <span class="seg seg-g"></span>
        </div>
      </div>
    </div>
    </div>
    <div class="presets">
      <button class="preset-btn" data-minutes="5">5</button>
      <button class="preset-btn active" data-minutes="10">10</button>
      <button class="preset-btn" data-minutes="25">25</button>
      <button class="preset-btn" data-minutes="50">50</button>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="startPause">Start</button>
      <button class="ctrl-btn" id="reset">Reset</button>
    </div>
  </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
